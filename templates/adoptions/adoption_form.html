{% extends 'base.html' %}

{% block title %}Adopt {{ pet.name }} - Paws & Connect{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Adoption Application for {{ pet.name }}</h4>
            </div>
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-4 pb-3 border-bottom">
                    {% if pet.image %}
                        <img src="{{ pet.image.url }}" alt="{{ pet.name }}" class="rounded-circle me-3" style="width: 60px; height: 60px; object-fit: cover;">
                    {% endif %}
                    <div>
                        <h5 class="mb-0">{{ pet.name }}</h5>
                        <small class="text-muted">{{ pet.breed }} • {{ pet.location }}</small>
                    </div>
                </div>

                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number *</label>
                        <input type="text" class="form-control" id="phone" name="phone" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="address" class="form-label">Home Address *</label>
                        <textarea class="form-control" id="address" name="address" rows="2" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Have you owned a pet before?</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="previous_pet_experience" id="exp_yes" value="yes">
                                <label class="form-check-label" for="exp_yes">Yes</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="previous_pet_experience" id="exp_no" value="no" checked>
                                <label class="form-check-label" for="exp_no">No</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="reason" class="form-label">Why do you want this pet? *</label>
                        <textarea class="form-control" id="reason" name="reason" rows="3" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="message" class="form-label">Additional Message (Optional)</label>
                        <textarea class="form-control" id="message" name="message" rows="2"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{% url 'pet_detail' pet.id %}" class="btn btn-outline-secondary me-md-2">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5">Submit Application</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
